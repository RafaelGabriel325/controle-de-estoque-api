image:
  repository: ghcr.io/RafaelGabriel325/api-controle-de-estoque
  # Tag será atualizada automaticamente pelo CI
  tag: "sha-599049a"

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    cpu: 750m
    memory: 768Mi
  requests:
    cpu: 300m
    memory: 384Mi

env:
  SPRING_PROFILES_ACTIVE: prod

postgres:
  host: ce-pg-rw.prod.svc.cluster.local
  port: 5432
  database: controleestoque
  username: postgres
  password: supersecret
  jdbcUrl: ""

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: estoque.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

rollout:
  enabled: true
  strategy: "canary"
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 60
      - setWeight: 50
      - pause:
          duration: 60
    trafficRouting:
      nginx:
        # If empty, the chart will default to the Ingress name ({{ include "controle-estoque.fullname" . }})
        stableIngress: ""
